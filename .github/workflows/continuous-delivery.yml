name: continuous delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: servico para publicar
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - api-gateway
          - identity-api
          - campaign-api
          - donation-processor
      republish_existing:
        description: republica a ultima versao se nao houver novos commits
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: continuous-delivery-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SHARED_PATH: src/BuildingBlocks
  REPUBLISH_EXISTING: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.republish_existing || 'false' }}

jobs:
  release-and-publish:
    name: release and publish (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            service_path: src/Gateways/ApiGateway
            dockerfile: src/Gateways/ApiGateway/Dockerfile
            initial_version: 1.0.0

          - service: identity-api
            service_path: src/Services/Identity/Identity.API
            dockerfile: src/Services/Identity/Identity.API/Dockerfile
            initial_version: 1.0.0

          - service: campaign-api
            service_path: src/Services/Campaign/Campaign.API
            dockerfile: src/Services/Campaign/Campaign.API/Dockerfile
            initial_version: 1.0.0

          - service: donation-processor
            service_path: src/Workers/DonationProcessor
            dockerfile: src/Workers/DonationProcessor/Dockerfile
            initial_version: 1.0.0

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: skip when service is not selected
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'auto' && github.event.inputs.service != 'all' && github.event.inputs.service != matrix.service
        run: echo "Service ${{ matrix.service }} was not selected for this manual execution"

      - name: compute next version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'auto' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        id: version
        shell: bash
        run: |
          bash .github/scripts/compute-next-version.sh \
            "${{ matrix.service }}" \
            "${{ matrix.service_path }}" \
            "${{ env.SHARED_PATH }}" \
            "${{ matrix.initial_version }}" \
            "${{ env.REPUBLISH_EXISTING }}" \
            "${{ matrix.service }}"

      - name: skip when release is not needed
        if: steps.version.outputs.should_release != 'true'
        run: echo "No new release required for ${{ matrix.service }}"

      - name: setup docker buildx
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        if: steps.version.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve image namespace
        if: steps.version.outputs.should_release == 'true'
        id: image
        shell: bash
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "namespace=ghcr.io/${OWNER_LOWER}/solidarityhub" >> "$GITHUB_OUTPUT"

      - name: docker metadata
        if: steps.version.outputs.should_release == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.namespace }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.next_version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.next_version }}
            org.opencontainers.image.title=${{ matrix.service }}

      - name: build and push image
        if: steps.version.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: create tag and release
        if: steps.version.outputs.should_release == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash .github/scripts/create-service-release.sh \
            "${{ matrix.service }}" \
            "${{ steps.version.outputs.tag_name }}" \
            "${{ steps.version.outputs.next_version }}" \
            "${{ steps.version.outputs.reuse_existing_tag }}"
