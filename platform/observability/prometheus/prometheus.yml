global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: campaign.api
    metrics_path: /metrics
    static_configs:
      - targets:
          - campaign.api:8080

  - job_name: api.gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api.gateway:8080

  - job_name: identity.api
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity.api:8080

  - job_name: donation.processor
    metrics_path: /metrics
    static_configs:
      - targets:
          - donation.processor:9464
