apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solidarityhub

resources:
  - ../../base

images:
  - name: api-gateway
    newName: solidarityhub/api-gateway
    newTag: local

  - name: identity-api
    newName: solidarityhub/identity-api
    newTag: local

  - name: campaign-api
    newName: solidarityhub/campaign-api
    newTag: local

  - name: donation-processor
    newName: solidarityhub/donation-processor
    newTag: local
