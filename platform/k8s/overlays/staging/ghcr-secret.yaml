apiVersion: v1
kind: Secret

metadata:
  name: ghcr-secret

type: kubernetes.io/dockerconfigjson

stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "<github-username>",
          "password": "<ghcr-token>",
          "email": "<email>"
        }
      }
    }
