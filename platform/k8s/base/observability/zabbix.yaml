apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: zabbix-postgres-pvc

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zabbix-postgres

spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-postgres
  template:
    metadata:
      labels:
        app: zabbix-postgres
    spec:
      containers:
        - name: zabbix-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: zabbix
            - name: POSTGRES_USER
              value: zabbix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ZABBIX_DB_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "zabbix", "-d", "zabbix"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "zabbix", "-d", "zabbix"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: zabbix-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: zabbix-postgres-data
          persistentVolumeClaim:
            claimName: zabbix-postgres-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: zabbix-postgres

spec:
  selector:
    app: zabbix-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zabbix-server

spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: DB_SERVER_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: zabbix
            - name: POSTGRES_USER
              value: zabbix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ZABBIX_DB_PASSWORD
            - name: ZBX_STARTPOLLERS
              value: "5"
            - name: ZBX_STARTPINGERS
              value: "1"
          ports:
            - containerPort: 10051
              name: zabbix-trapper

---
apiVersion: v1
kind: Service

metadata:
  name: zabbix-server

spec:
  selector:
    app: zabbix-server
  ports:
    - name: trapper
      port: 10051
      targetPort: 10051

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zabbix-web

spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: DB_SERVER_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: zabbix
            - name: POSTGRES_USER
              value: zabbix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ZABBIX_DB_PASSWORD
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: PHP_TZ
              value: America/Sao_Paulo
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: Service

metadata:
  name: zabbix-web

spec:
  selector:
    app: zabbix-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
# DaemonSet para monitorar cada node do AKS
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: zabbix-agent2

spec:
  selector:
    matchLabels:
      app: zabbix-agent2
  template:
    metadata:
      labels:
        app: zabbix-agent2
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: zabbix-agent2
          image: zabbix/zabbix-agent2:alpine-7.0-latest
          env:
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: ZBX_ACTIVESERVERIPV4
              value: zabbix-server
            - name: ZBX_ACTIVE_ALLOW
              value: "true"
            - name: ZBX_HOSTNAME
              value: Zabbix server
          ports:
            - containerPort: 10050
              name: agent
          securityContext:
            privileged: true

---
apiVersion: v1
kind: Service

metadata:
  name: zabbix-agent2

spec:
  selector:
    app: zabbix-agent2
  ports:
    - name: agent
      port: 10050
      targetPort: 10050
