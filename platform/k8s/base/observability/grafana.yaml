apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: grafana-pvc

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana

spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: alexanderzobnin-zabbix-app
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
            - name: grafana-dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/json/solidarityhub-overview.json
              subPath: solidarityhub-overview.json
            - name: grafana-dashboards-zabbix
              mountPath: /etc/grafana/provisioning/dashboards/json/solidarityhub-infra-zabbix.json
              subPath: solidarityhub-infra-zabbix.json
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-dashboards-zabbix
          configMap:
            name: grafana-dashboards-zabbix

---
apiVersion: v1
kind: Service

metadata:
  name: grafana

spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
