apiVersion: apps/v1
kind: Deployment

metadata:
  name: jaeger

spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          args:
            - --query.ui-config=/etc/jaeger-ui/ui-config.json
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
          volumeMounts:
            - name: ui-config
              mountPath: /etc/jaeger-ui
      volumes:
        - name: ui-config
          configMap:
            name: jaeger-ui-config

---
apiVersion: v1
kind: Service

metadata:
  name: jaeger

spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: jaeger-ui-config

data:
  ui-config.json: |
    {
      "uiConfig": {
        "theme": "dark"
      }
    }
