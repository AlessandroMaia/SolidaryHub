apiVersion: apps/v1
kind: Deployment

metadata:
  name: identity-api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
        - name: identity-api
          image: identity-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ConnectionStrings__IdentityDb
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__IdentityDb
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JwtSettings__Secret
            - name: AdminSeed__Password
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AdminSeed__Password
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service

metadata:
  name: identity-api

spec:
  selector:
    app: identity-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
