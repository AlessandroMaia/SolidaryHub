apiVersion: apps/v1
kind: Deployment

metadata:
  name: campaign-api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: campaign-api
  template:
    metadata:
      labels:
        app: campaign-api
    spec:
      containers:
        - name: campaign-api
          image: campaign-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ConnectionStrings__CampaignDb
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__CampaignDb
            - name: ConnectionStrings__RabbitMQ
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__RabbitMQ
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JwtSettings__Secret
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service

metadata:
  name: campaign-api

spec:
  selector:
    app: campaign-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
