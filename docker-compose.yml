name: solidary-hub

services:
  postgres:
    image: postgres:18.1-alpine
    container_name: sh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CAMPAIGN_DB_NAME: ${CAMPAIGN_DB_NAME}
      CAMPAIGN_DB_USER: ${CAMPAIGN_DB_USER}
      CAMPAIGN_DB_PASSWORD: ${CAMPAIGN_DB_PASSWORD}
    command: >
      postgres
        -c log_min_messages=INFO
        -c log_statement=none
        -c max_connections=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./platform/data/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - sh-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sh-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - sh-network

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: sh-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sh-network

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: sh-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - sh-network

  loki:
    image: grafana/loki:latest
    container_name: sh-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sh-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sh-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./platform/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api.gateway
      - campaign.api
      - identity.api
      - donation.processor
    networks:
      - sh-network

  grafana:
    image: grafana/grafana:latest
    container_name: sh-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - jaeger
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./platform/observability/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - sh-network

  api.gateway:
    image: ${DOCKER_REGISTRY:-sh}/api-gateway:${TAG:-local}
    build:
      context: .
      dockerfile: src/Gateways/ApiGateway/Dockerfile
    container_name: sh-api.gateway
    depends_on:
      identity.api:
        condition: service_healthy
      campaign.api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Loki: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: SH.IdentityService
      JwtSettings__Audience: SH.Client
      JwtSettings__AccessTokenExpirationMinutes: 60
      JwtSettings__RefreshTokenExpirationDays: 7
      ReverseProxy__Clusters__IdentityCluster__Destinations__IdentityApi__Address: http://identity.api:8080/
      ReverseProxy__Clusters__CampaignCluster__Destinations__CampaignApi__Address: http://campaign.api:8080/
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sh-network

  identity.api:
    image: ${DOCKER_REGISTRY:-sh}/identity-api:${TAG:-local}
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: sh-identity.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=${IDENTITY_DB_NAME};Username=${IDENTITY_DB_USER};Password=${IDENTITY_DB_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: SH.IdentityService
      JwtSettings__Audience: SH.Client
      JwtSettings__AccessTokenExpirationMinutes: 60
      AdminSeed__Enabled: ${IDENTITY_ADMIN_SEED_ENABLED:-false}
      AdminSeed__FirstName: ${IDENTITY_ADMIN_SEED_FIRST_NAME:-Administrador}
      AdminSeed__LastName: ${IDENTITY_ADMIN_SEED_LAST_NAME:-ONG}
      AdminSeed__Email: ${IDENTITY_ADMIN_SEED_EMAIL:-admin@conexaosolidaria.local}
      AdminSeed__Password: ${IDENTITY_ADMIN_SEED_PASSWORD:-change-me-admin-seed-password}
      AdminSeed__Cpf: ${IDENTITY_ADMIN_SEED_CPF:-52998224725}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sh-network

  campaign.api:
    image: ${DOCKER_REGISTRY:-sh}/campaign-api:${TAG:-local}
    build:
      context: .
      dockerfile: src/Services/Campaign/Campaign.API/Dockerfile
    container_name: sh-campaign.api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CampaignDb: Host=postgres;Port=5432;Database=${CAMPAIGN_DB_NAME};Username=${CAMPAIGN_DB_USER};Password=${CAMPAIGN_DB_PASSWORD}
      ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: SH.IdentityService
      JwtSettings__Audience: SH.Client
      JwtSettings__AccessTokenExpirationMinutes: 60
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sh-network

  donation.processor:
    image: ${DOCKER_REGISTRY:-sh}/donation-processor:${TAG:-local}
    build:
      context: .
      dockerfile: src/Workers/DonationProcessor/Dockerfile
    container_name: sh-donation.processor
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      ConnectionStrings__Loki: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DonationOptions__Succeded: ${DONATION_PROCESSED:-true}
      Prometheus__UriPrefixes__0: http://+:9464/
    networks:
      - sh-network

volumes:
  postgres-data:
  pgadmin-data:
  rabbitmq-data:
  grafana-data:
  prometheus-data:

networks:
  sh-network:
    driver: bridge
